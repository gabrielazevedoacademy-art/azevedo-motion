<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>07 · abertura curso Influencer com IA</title>
<link rel="stylesheet" href="/node_modules/@fontsource/instrument-serif/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/instrument-serif/400-italic.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/600.css">
<style>
  :root { --paper:#F2EDE4; --paper2:#E4DDD1; --border:#F8F5EE; --ink:#161412; --wine:#7B2431; --graph:#8B847A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:var(--W); height:var(--H); overflow:hidden; background:var(--paper); }
  body { font-family:Inter, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
  .serif { font-family:'Instrument Serif', serif; font-weight:400; }

  #pages { position:absolute; inset:0; }
  .page { position:absolute; inset:0; overflow:hidden; background-color:var(--paper); background-size:100% 100%; }
  .cam { position:absolute; inset:0; transform-origin:50% 50%; }
  .grid, .layer, .sub { position:absolute; inset:0; }
  .grid .col { position:absolute; width:1px; background:rgba(22,20,18,.085); transform-origin:top; }
  .grid .rule { position:absolute; height:1px; background:rgba(22,20,18,.55); transform-origin:left; }
  .crop { position:absolute; border-color:rgba(22,20,18,.45); border-style:solid; border-width:0; }
  .turnEdge { position:absolute; top:0; bottom:0; left:0; background:var(--paper2); border-left:1px solid rgba(22,20,18,.35); display:none; z-index:5; }

  .mask { position:absolute; overflow:hidden; }
  .ch { display:inline-block; will-change:transform; }
  .print { position:absolute; left:0; top:0; }
  .big { position:absolute; white-space:nowrap; line-height:1; color:var(--ink); }
  .lead { position:absolute; white-space:nowrap; font-style:italic; color:var(--ink); line-height:1; }
  .lead span { display:inline-block; }
  .wrule { position:absolute; background:var(--wine); transform-origin:left; }
  .strike { position:absolute; background:var(--wine); transform-origin:left; }
  .dot { position:absolute; border-radius:50%; background:var(--ink); }
  .loupe { position:absolute; border-radius:50%; box-shadow:0 0 0 calc(var(--u) * .45) var(--border), calc(var(--u) * .35) calc(var(--u) * .45) 0 calc(var(--u) * .45) rgba(22,20,18,.16); }
  .loupe canvas { display:block; border-radius:50%; }
  .swatch { position:absolute; border-radius:50%; box-shadow:calc(var(--u) * .3) calc(var(--u) * .4) 0 rgba(22,20,18,.16); }
  .tile { position:absolute; display:flex; align-items:center; justify-content:center; background:var(--border); border:2px solid #C9C1B4; color:var(--ink); line-height:1; }
  .tile.serif span { font-family:'Instrument Serif'; }
  .tile.sans span { font-family:Inter; font-weight:600; letter-spacing:-.02em; }
  .frame { position:absolute; border:1.5px solid rgba(22,20,18,.4); }
  .vidmarks { position:absolute; }
  .vidmarks .strip { position:absolute; top:0; bottom:0; background:var(--ink); }
  .vidmarks .hole { position:absolute; background:var(--border); border-radius:2px; }
  .vidmarks .play { position:absolute; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; padding-left:4%; }
  .vidmarks .progress { position:absolute; background:rgba(247,243,236,.55); }
  .vidmarks .fill { position:absolute; inset:0; background:var(--wine); transform-origin:left; }
  .vline { position:absolute; width:1px; background:rgba(22,20,18,.3); transform-origin:top; }
  .hline { position:absolute; height:1px; background:rgba(22,20,18,.3); transform-origin:left; }
  .pring { position:absolute; border:calc(var(--u) * .4) solid var(--wine); border-radius:50%; }
  .bag { position:absolute; }
  .sheet { position:absolute; background:var(--border); box-shadow:calc(var(--u) * .4) calc(var(--u) * .5) 0 rgba(22,20,18,.16); }
  .sheet .tline { position:absolute; background:#D3CBBE; }
  .sheet .sigline { position:absolute; height:1.5px; background:rgba(22,20,18,.6); }
  .cover { position:absolute; background:var(--border); box-shadow:calc(var(--u) * .5) calc(var(--u) * .6) 0 rgba(22,20,18,.18); transform-origin:50% 100%; }
  .cover .spine { position:absolute; left:0; top:0; bottom:0; background:var(--wine); }
  .covertitle { position:absolute; line-height:.95; color:var(--ink); white-space:nowrap; }
  .academy { position:absolute; color:var(--ink); font-weight:600; text-transform:uppercase; letter-spacing:.22em; white-space:nowrap; }
  .arrow { position:absolute; }
  .cursor { position:absolute; left:0; top:0; z-index:8; transform-origin:0 0; }
  .cursor svg { display:block; }
  .ring { position:absolute; left:0; top:0; width:calc(var(--u) * 6); height:calc(var(--u) * 6); border:2px solid var(--ink); border-radius:50%; display:none; z-index:7; }

  #caps { position:absolute; left:0; right:0; text-align:center; font-weight:500; line-height:1.3; z-index:20; }
  #caps .line { display:inline-block; padding:.18em .55em .22em; }
  #caps .w { display:inline-block; }
  #grain { position:absolute; inset:-128px; z-index:30; opacity:.055; mix-blend-mode:multiply; pointer-events:none; }
</style>
</head>
<body>
<div id="pages"></div>
<div id="caps"></div>
<div id="grain"></div>

<script type="module">
import { springProgress, clamp, hash } from '/lib/motion.js';
import { WORDS, SENTENCES } from './tempos.js';

// contrato exposto imediatamente; o carregamento pesado fica em READY (o motor espera por ela)
window.DURATION = 30;
window.SCENES = [
  { name: 'feed', start: 0, end: 4.63 },
  { name: 'rosto', start: 4.63, end: 7.03 },
  { name: 'estratégia', start: 7.03, end: 9.40 },
  { name: 'influencer com IA', start: 9.40, end: 12.80 },
  { name: 'nº01 público', start: 12.80, end: 14.27 },
  { name: 'nº02 identidade', start: 14.27, end: 15.91 },
  { name: 'nº03 conteúdo', start: 15.91, end: 19.45 },
  { name: 'renda', start: 19.45, end: 27.28 },
  { name: 'assinatura', start: 27.28, end: 30 },
];
window.POSTER_T = 29.3;

let scenes = [], seekCaps = () => {}, grain = null;
function seek(t) {
  t = clamp(t, 0, window.DURATION); window.__t = t;
  for (const s of scenes) {
    const on = t >= s.a && t < s.b;
    s.page.style.display = on ? 'block' : 'none';
    if (on) s.seek(t);
  }
  seekCaps(t);
  if (grain) { const f = Math.floor(t * 24); grain.style.backgroundPosition = `${Math.floor(hash(f) * 256)}px ${Math.floor(hash(f + 999) * 256)}px`; }
}
window.seek = seek;

window.READY = (async () => {
  await Promise.all([
    '400 100px "Instrument Serif"', 'italic 400 100px "Instrument Serif"',
    '400 20px Inter', '500 20px Inter', '600 20px Inter',
  ].map((f) => document.fonts.load(f, 'ESTRATÉGIAÇÃÕ éíúâêô Nº0123 Aa')));
  const B = await import('./js/base.js');
  const { P, $, el, wt, capSize, capsTop, paperTexture, grainTexture, loadImage } = B;
  paperTexture(); grain = $('grain'); grainTexture(grain);
  const A = '/assets/curso-influencer/';
  const names = { p01: '01-danca-estudio', p02: '02-academia-espelho', p03: '03-quarto-anime', p04: '04-ensaio-estudio-foto', p05: '05-podcast-setup' };
  const IMG = {}, MASK = {};
  await Promise.all(Object.entries(names).map(async ([k, n]) => { IMG[k] = await loadImage(A + n + '.webp'); }));
  await Promise.all(['p01', 'p02', 'p03'].map(async (k) => { MASK[k] = await loadImage(A + 'mascaras/' + names[k] + '.png'); }));
  const { buildScenes } = await import('./js/cenas.js');
  scenes = await buildScenes(IMG, MASK);

  // ---------------------------------------------------------------- legendas: palavra falada em tinta, próximas a 35%
  const caps = $('caps');
  caps.style.fontSize = capSize + 'px';
  caps.style.top = capsTop + 'px';
  const MAXC = P ? 30 : 58;
  const chunks = [];
  for (const s of SENTENCES) {
    let cur = [];
    const flush = () => { if (cur.length) chunks.push({ a: cur[0], b: cur.at(-1) }); cur = []; };
    for (let i = s.a; i <= s.b; i++) {
      const len = cur.reduce((n, k) => n + WORDS[k].w.length + 1, 0) + WORDS[i].w.length;
      if (len > MAXC) flush();
      cur.push(i);
      if (/[:,]$/.test(WORDS[i].w) && len > MAXC * 0.55) flush();
    }
    flush();
  }
  chunks.forEach((c) => { c.start = wt(c.a) - 0.08; });
  chunks.forEach((c, k) => {
    const next = chunks[k + 1], endSpeech = WORDS[c.b].end;
    c.end = next && wt(next.a) - endSpeech < 0.9 ? next.start : Math.min(endSpeech + 0.45, window.DURATION);
  });
  let capIdx = -2, capWords = [];
  seekCaps = (t) => {
    const k = chunks.findIndex((c) => t >= c.start && t < c.end);
    if (k !== capIdx) {
      capIdx = k; caps.innerHTML = '';
      if (k >= 0) {
        const line = el('span', 'line', caps); capWords = [];
        for (let i = chunks[k].a; i <= chunks[k].b; i++) { const w = el('span', 'w', line); w.textContent = WORDS[i].w; capWords.push({ w, i }); line.appendChild(document.createTextNode(' ')); }
        line.lastChild.remove();
      }
    }
    if (k < 0) return;
    const p = springProgress(t - chunks[k].start, 'snappy');
    caps.style.transform = `translateY(${(1 - p) * capSize * 0.4}px)`;
    caps.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
    for (const { w, i } of capWords) w.style.color = t >= wt(i) ? 'var(--ink)' : 'rgba(22,20,18,.35)';
  };
  seek(window.__t ?? 0);
})();
</script>
</body>
</html>
