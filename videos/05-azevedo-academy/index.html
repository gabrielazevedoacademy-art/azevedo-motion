<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>05-azevedo-academy</title>
<link rel="stylesheet" href="/node_modules/@fontsource/anton/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/bebas-neue/400.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="/node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  /* paleta amostrada do banner real (assets/azevedo-academy/colors.json) */
  :root { --bg:#0E0C09; --bg2:#15120C; --or:#F97102; --orD:#C64906; --li:#BBE000; --liH:#DEED1E; --paper:#F4F1EA; --mute:#8A857C; --yt:#0F0F0F; --ytp:#212121; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:var(--W); height:var(--H); overflow:hidden; background:var(--bg); }
  body { font-family:Inter, sans-serif; color:var(--paper); -webkit-font-smoothing:antialiased; }
  .abs { position:absolute; left:0; top:0; }
  #bgc { position:absolute; inset:0; }
  .scene { position:absolute; inset:0; overflow:hidden; display:none; }
  .inner { position:absolute; inset:0; transform-origin:50% 50%; }
  .anton { font-family:Anton, sans-serif; text-transform:uppercase; line-height:1; white-space:nowrap; }
  .bebas { font-family:'Bebas Neue', sans-serif; line-height:.88; white-space:nowrap; }
  .mono { font-family:'JetBrains Mono', monospace; font-weight:500; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  .ch { display:inline-block; }
  .mask { position:absolute; overflow:hidden; white-space:nowrap; }
  .mask > span { display:inline-block; }
  .crop { display:block; }
  .screen { mix-blend-mode:screen; }

  /* S1 */
  #cx .ch { -webkit-text-stroke-width:var(--sw); }
  #tangle { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #rule1 { position:absolute; background:var(--li); transform-origin:left center; }

  /* S2 */
  #banner { position:absolute; perspective:1600px; }
  .tile { position:absolute; overflow:hidden; backface-visibility:hidden; }
  .tile img { position:absolute; }
  .tile .seam { position:absolute; inset:0; border:2px solid var(--li); }
  #glint { position:absolute; top:-20%; height:140%; mix-blend-mode:screen; pointer-events:none;
           background:linear-gradient(90deg, transparent 0%, rgba(222,237,30,.0) 20%, rgba(222,237,30,.42) 46%, rgba(255,255,255,.65) 50%, rgba(222,237,30,.42) 54%, transparent 80%); }
  .q { position:absolute; left:0; top:0; border-radius:50%; overflow:hidden; }
  .q img { width:100%; height:100%; display:block; }
  .glow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, rgba(249,113,2,.55), rgba(249,113,2,.18) 60%, transparent); }
  svg.ring { position:absolute; overflow:visible; }

  /* S3 */
  #rail { position:absolute; left:0; top:0; width:100%; height:100%; }
  .thumb { position:absolute; overflow:hidden; border-radius:var(--r); background:#000; }
  .thumb img { position:absolute; inset:0; width:100%; height:100%; transform-origin:50% 50%; }
  .chip { position:absolute; background:var(--li); color:#0E0C09; font-family:'JetBrains Mono'; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-radius:999px; white-space:nowrap; transform-origin:left center; }
  .frame { position:absolute; border:3px solid var(--li); border-radius:12px; }
  .bar { position:absolute; background:var(--li); transform-origin:center top; }
  .ripple { position:absolute; border-radius:50%; border:4px solid var(--li); }

  /* S4 */
  #panel { position:absolute; background:var(--ytp); border-radius:22px; box-shadow:0 30px 80px rgba(0,0,0,.45); transform-origin:left center; }
  .col { position:absolute; overflow:hidden; }
  .strip { position:absolute; left:0; top:0; width:100%; }
  .strip div { text-align:center; }

  /* S5 */
  .spark { position:absolute; left:0; top:0; }

  /* cursor, cortina, HUD, grão */
  #cursor { position:absolute; left:0; top:0; display:none; z-index:8; transform-origin:4px 4px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  #wipe { position:absolute; display:none; z-index:9; }
  #wipe > div { position:absolute; top:0; height:100%; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; color:var(--paper); }
  #hud div { position:absolute; white-space:nowrap; opacity:.72; }
  #hud .dot { display:inline-block; width:.62em; height:.62em; border-radius:50%; background:var(--li); margin-right:.5em; }
  #grain { position:absolute; inset:-64px; z-index:11; opacity:.06; mix-blend-mode:overlay; pointer-events:none; }
</style>
</head>
<body>
<canvas id="bgc"></canvas>

<section class="scene" id="s1"><div class="inner" id="s1in">
  <div class="mask anton" id="l1"><span id="l1t">Simplificar</span></div>
  <div class="mask anton" id="lO"><span id="lOt">O</span></div>
  <div class="abs anton" id="cx">Complexo.</div>
  <svg id="tangle"></svg>
  <div id="rule1"></div>
  <div class="mask mono" id="cap1"><span>Inteligência Artificial · Design · Tecnologia</span></div>
</div></section>

<section class="scene" id="s2"><div class="inner" id="s2in">
  <div id="banner"></div>
  <div class="glow" id="avGlow"></div>
  <div class="abs" id="av"></div>
  <svg class="ring" id="avRing"><circle fill="none" stroke="#F97102" stroke-linecap="round"/></svg>
  <div class="mask" id="hdr"><img class="crop" src="/assets/azevedo-academy/screens/header_name_alpha@3x.png"></div>
  <div class="mask mono" id="cap2"><span>No ar desde 3 de dez. de 2025 · Brasil</span></div>
</div></section>

<section class="scene" id="s3"><div class="inner" id="s3in"><div id="rail"></div></div></section>

<section class="scene" id="s4"><div class="inner" id="s4in">
  <div id="panel"><img class="crop" id="panelImg" src="/assets/azevedo-academy/screens/rows_stats@3x.png"><div class="frame" id="rowFrame"></div></div>
  <svg id="link" class="abs" style="overflow:visible"><path fill="none" stroke="#BBE000" stroke-linecap="round"/></svg>
  <div class="abs" id="num"></div>
  <div class="mask bebas" id="numLabel"><span>Visualizações</span></div>
  <div id="rule4" class="abs" style="background:var(--li);transform-origin:left center"></div>
  <div class="mask mono" id="cap4"><span>Total do canal · desde dez. 2025</span></div>
</div></section>

<section class="scene" id="s5"><div class="inner" id="s5in">
  <div class="glow" id="sigGlow"></div>
  <div class="abs" id="sigAv" style="border-radius:50%;overflow:hidden"><img src="/assets/azevedo-academy/avatar_900.jpg" style="width:100%;height:100%;display:block" id="sigAvImg"></div>
  <svg class="ring" id="sigRing"><circle fill="none" stroke="#F97102" stroke-linecap="round"/></svg>
  <div class="mask bebas" id="n1"><span id="n1t">AZEVEDO</span></div>
  <div class="mask bebas" id="n2"><span id="n2t">ACADEMY</span></div>
  <div class="mask mono" id="url"><span>youtube.com/@Azevedo.Academy</span></div>
  <div class="abs" id="rings5"></div>
  <img class="abs" id="subBtn" style="border-radius:999px" src="/assets/azevedo-academy/screens/subscribe_dark@3x.png">
  <img class="abs" id="bell" src="/assets/azevedo-academy/bell_alpha.png">
  <div class="abs" id="sparks"></div>
  <div class="mask mono" id="cap5"><span>▶ Novo vídeo toda semana</span></div>
</div></section>

<svg id="cursor" width="44" height="54" viewBox="0 0 44 54"><path d="M4 4 L4 43 L14 33 L21 49 L28 46 L21 30 L36 30 Z" fill="#F4F1EA" stroke="#0E0C09" stroke-width="3" stroke-linejoin="round"/></svg>
<div id="wipe"><div style="background:#15120C"></div><div style="background:#F97102"></div><div style="background:#BBE000"></div></div>
<div id="hud" class="mono">
  <div id="hTL">Azevedo — Academy</div>
  <div id="hTR"></div>
  <div id="hBL"></div>
  <div id="hBR"><span class="dot"></span>120 BPM</div>
</div>
<div id="grain"></div>

<script type="module">
import { springProgress as sp, track, inOut, stagger, clamp, lerp, rng, hash, noise, mixColor, beats, sceneAt } from '/lib/motion.js';
import { createLayout, applyRoot, fitText } from '/lib/layout.js';

await Promise.all(['400 100px Anton', '400 100px "Bebas Neue"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"', '500 20px Inter']
  .map((f) => document.fonts.load(f, 'AZÉÇÃÕÍ0123456789·@./▶')));
const L = applyRoot(createLayout());
const { W, H, u, safe } = L;
const P = L.isPortrait;
const B = beats(120, 20);                         // 1 batida = 0,5 s · 1 compasso = 2 s
const A = '/assets/azevedo-academy/';
const C = { bg: '#0E0C09', bg2: '#15120C', or: '#F97102', orD: '#C64906', li: '#BBE000', liH: '#DEED1E', paper: '#F4F1EA', mute: '#8A857C' };
const $ = (id) => document.getElementById(id);
const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const pos = (e, x, y, w, h) => { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; };
const chars = (e) => { const t = e.textContent; e.innerHTML = [...t].map((c) => `<span class="ch">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); return [...e.querySelectorAll('.ch')]; };
const rise = (list, t, t0, step = 0.03, preset = 'heavy') => list.forEach((c, k) => { const p = sp(t - t0 - k * step, preset); c.style.transform = `translate(0,${(1 - p) * 150}%)`; });
const wipeIn = (e, p) => { e.style.clipPath = `inset(-20% ${(1 - clamp(p)) * 100}% -20% -2%)`; };
const pulse = (t, c, a = 0.05, b = 0.08) => sp(t - (c - a), 'snappy') - sp(t - (c + b), 'snappy');
// impulso amortecido (resposta de mola a um empurrão): começa em 0, oscila e assenta em 0
const kick = (t, t0, preset = 'default') => { const o = typeof preset === 'string' ? { preset } : preset; return sp(t - t0, { ...o, velocity: 1 }) - sp(t - t0, o); };
const shake = (t, t0, amp) => (t < t0 ? 0 : amp * kick(t, t0, { stiffness: 900, damping: 18 }) * 30);
function measure(sec, fn) { const s = $(sec); const d = s.style.display; s.style.display = 'block'; const r = fn(); s.style.display = d; return r; }

const DATA = await fetch(A + 'channel.json').then((r) => r.json());
const VIDS = DATA.em_alta_top3.map((v, i) => ({ ...v, meta: A + `screens/card${i + 1}_meta_alpha.png`, click: [[0.6, 0.42], [0.66, 0.5], [0.58, 0.38]][i] }));

const SCENES = [
  { name: 'gancho', start: 0, end: 3 },
  { name: 'o canal', start: 3, end: 6 },
  { name: 'em alta #1', start: 6, end: 8 },
  { name: 'em alta #2', start: 8, end: 10 },
  { name: 'em alta #3', start: 10, end: 12 },
  { name: 'o número', start: 12, end: 16 },
  { name: 'assinatura', start: 16, end: 20 },
];
const STORY = [0, 1, 2, 2, 2, 3, 4];
const SEC = ['s1', 's2', 's3', 's3', 's3', 's4', 's5'];
const CUTS = [3, 6, 12, 16];
window.DURATION = 20;
window.SCENES = SCENES;
window.POSTER_T = 19.6;

// ------------------------------------------------------------------ grão
{
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256), r = rng(42);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  $('grain').style.backgroundImage = `url(${c.toDataURL()})`;
}

// ------------------------------------------------------------------ fundo: riscos de luz do banner + estrelas de 4 pontas
const bgc = $('bgc'); bgc.width = W; bgc.height = H;
const g = bgc.getContext('2d');
const STREAKS = [], STARS = [];
{
  const r = rng(11);
  for (let i = 0; i < 26; i++) STREAKS.push({ side: i % 2, o: r(), len: 0.35 + r() * 0.6, w: 1 + r() * 4, a: 0.25 + r() * 0.75, sp: 0.4 + r() * 0.9 });
  for (let i = 0; i < 30; i++) STARS.push({ x: r(), y: r(), s: 0.4 + r() * 1.1, ph: r() * 6.28, c: r() < 0.5 ? 0 : 1 });
}
function star(x, y, R, rot = 0) {
  g.beginPath();
  for (let k = 0; k < 8; k++) {
    const a = rot + k * Math.PI / 4, rr = k % 2 ? R * 0.22 : R;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill();
}
const energyKF = [[0, 1], [5.9, 0.85], [6, 0.35], [12, 0.6], [16, 1]];
function drawBg(t) {
  const e = track(energyKF, t, 'snappy');
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  // brilhos difusos: laranja embaixo à esquerda, lima à direita (como no banner)
  const D = Math.max(W, H);
  let rg = g.createRadialGradient(0, H, 0, 0, H, D * 0.6);
  rg.addColorStop(0, `rgba(249,113,2,${0.2 * e})`); rg.addColorStop(1, 'rgba(249,113,2,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  rg = g.createRadialGradient(W * 1.05, H * 0.45, 0, W * 1.05, H * 0.45, D * 0.5);
  rg.addColorStop(0, `rgba(187,224,0,${0.13 * e})`); rg.addColorStop(1, 'rgba(187,224,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // riscos diagonais (≈ -38°), deslizando ao longo da própria direção
  const a = -0.66, dx = Math.cos(a), dy = Math.sin(a);
  g.lineCap = 'round';
  for (const s of STREAKS) {
    const L0 = D * s.len;
    const slide = ((t * s.sp * 0.22 + s.o) % 1) * D * 0.5;
    let x0, y0;
    if (s.side === 0) { x0 = -W * 0.2 + s.o * W * 0.3; y0 = H * (1.05 + s.o * 0.12); }
    else { x0 = W * (0.74 + s.o * 0.4); y0 = H * (0.85 + s.o * 0.5); }
    x0 += dx * slide; y0 += dy * slide;
    const x1 = x0 + dx * L0, y1 = y0 + dy * L0;
    const col = s.side === 0 ? '249,113,2' : '187,224,0';
    const lg = g.createLinearGradient(x0, y0, x1, y1);
    lg.addColorStop(0, `rgba(${col},0)`); lg.addColorStop(0.55, `rgba(${col},${s.a * 0.5 * e})`); lg.addColorStop(1, `rgba(${col},0)`);
    g.strokeStyle = lg; g.lineWidth = s.w * u * 0.12; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  }
  // estrelas de 4 pontas piscando no pulso da batida
  const pul = B.pulse(t, 6);
  for (const s of STARS) {
    const tw = 0.5 + 0.5 * Math.sin(t * 2.4 + s.ph);
    const R = u * 0.9 * s.s * (0.45 + 0.55 * tw) * (1 + 0.35 * pul) * (0.5 + 0.5 * e);
    g.fillStyle = s.c ? `rgba(222,237,30,${0.85 * e})` : `rgba(255,140,40,${0.85 * e})`;
    star(s.x * W, s.y * H, R, Math.PI / 4 * 0);
  }
}

// ------------------------------------------------------------------ HUD
const hudSize = L.pick({ landscape: u * 1.45, portrait: u * 2.3 });
for (const id of ['hTL', 'hTR', 'hBL', 'hBR']) $(id).style.fontSize = hudSize + 'px';
const hy0 = L.pick({ landscape: u * 3.6, portrait: safe.y - hudSize * 2.4 });
const hy1 = L.pick({ landscape: H - u * 3.6 - hudSize, portrait: safe.y + safe.h + hudSize * 0.8 });
const hxL = safe.x, hxR = W - safe.x - safe.w;
Object.assign($('hTL').style, { left: hxL + 'px', top: hy0 + 'px' });
Object.assign($('hTR').style, { right: hxR + 'px', top: hy0 + 'px' });
Object.assign($('hBL').style, { left: hxL + 'px', top: hy1 + 'px' });
Object.assign($('hBR').style, { right: hxR + 'px', top: hy1 + 'px' });
const tc = (t) => { const f = Math.floor(t * 60 + 1e-6), s = Math.floor(f / 60); return `00:00:${String(s).padStart(2, '0')}:${String(f % 60).padStart(2, '0')}`; };
const STORY_NAMES = ['gancho', 'o canal', 'em alta', 'o número', 'assinatura'];

// ------------------------------------------------------------------ cortina diagonal (cobre os cortes 3, 6, 12 e 16 s)
const wipe = $('wipe');
const skewDeg = 14, skewPad = H * 1.2 * Math.tan(skewDeg * Math.PI / 180) / 2 + 20;
const wipeW = W * 1.7 + skewPad * 2;
pos(wipe, 0, -H * 0.1, wipeW, H * 1.2);
{
  const [d, o, l] = wipe.children;
  Object.assign(d.style, { left: 0, width: wipeW * 0.22 + 'px' });
  Object.assign(o.style, { left: wipeW * 0.22 + 'px', width: wipeW * 0.7 + 'px' });
  Object.assign(l.style, { left: wipeW * 0.92 + 'px', width: wipeW * 0.08 + 'px' });
}
function drawWipe(t) {
  const c = CUTS.find((k) => t > k - 0.2 && t < k + 0.9);
  if (c == null) { wipe.style.display = 'none'; return; }
  // uma mola só, criticamente amortecida, que cruza 50% exatamente no corte (w0·τ ≈ 1,68 → τ = 0,2 s)
  const p = sp(t - (c - 0.2), { stiffness: 70, damping: 16.8 });
  const x = lerp(-(wipeW + skewPad), W + skewPad, p);
  wipe.style.display = 'block';
  wipe.style.transform = `translateX(${x}px) skewX(${-skewDeg}deg)`;
}

// ------------------------------------------------------------------ cursor (seta de sistema)
const cursor = $('cursor');
const cs = L.pick({ landscape: 1.25, portrait: 1.6 });
cursor.style.width = 44 * cs + 'px'; cursor.style.height = 54 * cs + 'px';

// ================================================================== S1 · GANCHO — "simplificar o complexo"
const l1 = $('l1'), lO = $('lO'), cx = $('cx');
const s1Size = fitText($('l1t'), L.pick({ landscape: safe.w * 0.74, portrait: safe.w }), { max: 430 });
for (const e of [l1, lO, cx]) e.style.fontSize = s1Size + 'px';
const lh1 = s1Size * 1.04;
const blk = lh1 * 2 + s1Size * 0.45;
const s1y = L.pick({ landscape: H * 0.5 - blk * 0.5 - s1Size * 0.06, portrait: safe.y + safe.h * 0.42 - blk * 0.5 });
const mH = s1Size * 1.16;               // caixa da máscara maior que a linha: nada é cortado
pos(l1, safe.x - s1Size * 0.02, s1y - s1Size * 0.08, null, mH);
const oW = measure('s1', () => $('lOt').getBoundingClientRect().width);
const spaceW = s1Size * 0.22;
pos(lO, safe.x - s1Size * 0.02, s1y + lh1 - s1Size * 0.08, null, mH);
const l1chars = chars($('l1t'));
const oChar = chars($('lOt'));
const cxChars = chars(cx);
pos(cx, safe.x + oW + spaceW, s1y + lh1);
cx.style.setProperty('--sw', Math.max(2, s1Size * 0.012) + 'px');
// posições finais de cada letra de COMPLEXO (centro, relativo ao quadro)
const cxBase = measure('s1', () => cxChars.map((c) => { const r = c.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }));
const cxEnd = measure('s1', () => cx.getBoundingClientRect().right);
// caos: cada letra espalhada pelo quadro, girada e em outra escala (com semente)
const CHAOS = cxChars.map((_, k) => {
  const ax = W * (0.1 + 0.8 * hash(k * 13 + 5)), ay = H * (0.14 + 0.72 * hash(k * 7 + 3));
  return { dx: ax - cxBase[k].x, dy: ay - cxBase[k].y, rot: (hash(k * 31 + 1) - 0.5) * 110, sc: 0.5 + hash(k * 17 + 9) * 0.9 };
});
const TANGLE = []; for (let k = 0; k < cxChars.length; k++) { TANGLE.push([k, (k + 1) % cxChars.length]); TANGLE.push([k, (k + 3) % cxChars.length]); }
const tangle = $('tangle');
const rule1 = $('rule1');
const r1y = s1y + lh1 * 2 + s1Size * 0.04;
pos(rule1, safe.x, r1y, Math.min(safe.w, cxEnd - safe.x), Math.max(5, u * 0.7));
const cap1 = $('cap1');
const capSize = L.pick({ landscape: u * 2.1, portrait: u * 3.1 });
cap1.style.fontSize = capSize + 'px';
pos(cap1, safe.x, r1y + u * 2.2, null, capSize * 1.4);
if (P) { // no 9:16 a legenda quebra em duas linhas
  cap1.firstElementChild.innerHTML = 'Inteligência Artificial<br>· Design · Tecnologia';
  cap1.style.height = capSize * 2.8 + 'px'; cap1.style.whiteSpace = 'normal'; cap1.style.lineHeight = '1.4';
}

function drawS1(t) {
  rise(l1chars, t, B.beat(1) - 0.1, 0.028);
  rise(oChar, t, B.beat(2) - 0.06, 0);
  let lines = '';
  const cur = [];
  cxChars.forEach((c, k) => {
    const ch = CHAOS[k];
    const pin = sp(t + 0.32 - k * 0.05, 'snappy');                 // já em movimento no frame 0
    const p = sp(t - B.beat(2) - k * 0.014, 'snappy');             // encaixe na batida 2
    const q = 1 - p;
    const dx = (ch.dx + noise(t * 0.9 + k * 3.1, 1) * u * 5) * q;
    const dy = (ch.dy + noise(t * 0.9 + k * 3.1, 2) * u * 5) * q;
    const rot = (ch.rot + noise(t * 0.7 + k, 3) * 14) * q;
    const sc = lerp(ch.sc, 1, p) * pin;
    c.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${sc})`;
    c.style.color = `rgba(249,113,2,${p})`;
    c.style.webkitTextStrokeColor = mixColor(C.li, C.or, p);

{ const c = sigRing.firstElementChild; c.setAttribute('cx', D5 / 2 + rp5); c.setAttribute('cy', D5 / 2 + rp5); c.setAttribute('r', ringR5); c.setAttribute('stroke-width', Math.max(5, D5 * 0.02)); c.setAttribute('stroke-dasharray', circ5); c.setAttribute('transform', `rotate(-90 ${D5 / 2 + rp5} ${D5 / 2 + rp5})`); }
let yy = stackTop;
pos(n1, cxOf(n1w) - nS * 0.01, yy - nS * 0.06, null, nS * 0.98); yy += nLH;
pos(n2, cxOf(n2w) - nS * 0.01, yy - nS * 0.06, null, nS * 0.98); yy += nLH + gap;
pos(url, cxOf(urlW), yy, null, urlS * 1.3); yy += urlS * 1.3 + gap * 1.4;
const rowW = btnW + u * 2 + bellW;
const bx5 = cxOf(rowW), by5 = yy;
pos($('subBtn'), bx5, by5, btnW, btnH);
pos($('bell'), bx5 + btnW + u * 2, by5 + (btnH - bellH) / 2, bellW, bellH);
$('bell').style.transformOrigin = '50% 12%';
yy += btnH + gap;
pos(cap5, cxOf(cap5W), yy, null, capSize * 1.4);
const n1c = chars($('n1t')), n2c = chars($('n2t'));
const btnC = { x: bx5 + btnW / 2, y: by5 + btnH / 2 };
const RINGS = [0, 1].map(() => mk('div', 'ripple', $('rings5')));
const SPARKS = [];
{
  const r = rng(77);
  for (let i = 0; i < 18; i++) {
    const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    sv.setAttribute('viewBox', '-10 -10 20 20'); sv.setAttribute('class', 'spark');
    sv.innerHTML = '<path d="M0 -10 L2.2 -2.2 L10 0 L2.2 2.2 L0 10 L-2.2 2.2 L-10 0 L-2.2 -2.2 Z"/>';
    sv.firstElementChild.setAttribute('fill', i % 2 ? C.liH : '#FF8A1F');

    const a = (i / 18) * Math.PI * 2 + r() * 0.3;
    SPARKS.push({ sv, a, d: btnW * (0.7 + r() * 0.9), s: u * (1.6 + r() * 1.8), rot: r() * 180, dl: r() * 0.06 });
  }
}
const CLICK5 = B.beat(36);

function drawS5(t) {
  const t0 = 16;
  const ap = sp(t - (t0 - 0.02), 'heavy');
  $('sigAv').style.clipPath = `circle(${ap * 50}% at 50% 50%)`;
  $('sigAvImg').style.transform = `scale(${1.25 - 0.25 * ap})`;

  const bl = sp(t - B.beat(34) - 0.1, 'snappy');

// ------------------------------------------------------------------ cursor: trajetórias (coordenadas de tela)
const off = { x: W + 80, y: H * 1.05 };
const curKF = [[0, off]];
for (let i = 0; i < 3; i++) {

}
curKF.push([11.6, { x: W + 120, y: H * 0.25 }], [16.8, off], [17.25, { x: btnC.x + btnW * 0.9, y: btnC.y + btnH * 1.6 }], [17.62, { x: btnC.x - btnW * 0.08, y: btnC.y + btnH * 0.05 }], [18.45, { x: btnC.x + btnW * 0.35, y: btnC.y + btnH * 1.1 }], [19.0, { x: W + 120, y: H * 1.1 }]);
function drawCursor(t) {
  const on = (t > 6.3 && t < 12) || (t > 16.9);
  cursor.style.display = on ? 'block' : 'none';
  if (!on) return;
  const p = track(curKF, t, 'snappy');
  let pr = 0; for (const c of [7, 9, 11, CLICK5]) pr += pulse(t, c, 0.06, 0.06);
  cursor.style.transform = `translate(${p.x - 4 * cs}px, ${p.y - 4 * cs}px) scale(${1 - 0.18 * pr})`;
}

// ------------------------------------------------------------------ seek(t): desenha o frame EXATO
const SECTIONS = ['s1', 's2', 's3', 's4', 's5'].map($);
function seek(t) {
  const { index } = sceneAt(SCENES, t);
  const sec = SEC[index];
  SECTIONS.forEach((e) => (e.style.display = e.id === sec ? 'block' : 'none'));
  drawBg(t);
  $('hTR').textContent = `${String(STORY[index] + 1).padStart(2, '0')}/05 · ${STORY_NAMES[STORY[index]]}`;
  $('hBL').textContent = tc(t);
  $('hBR').querySelector('.dot').style.transform = `scale(${0.6 + 0.6 * B.pulse(t, 7)})`;
